# Stack de desenvolvimento local. NÃO usar como está em produção:
# APP_DEBUG fica ligado de propósito (facilita debug local) e não há TLS/proxy configurado.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      APP_NAME: "Quem me deve"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: America/Sao_Paulo
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c timezone=America/Sao_Paulo
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:

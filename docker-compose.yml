# Stack de desenvolvimento local. NÃO usar como está em produção:
# APP_DEBUG fica ligado de propósito (facilita debug local) e não há TLS/proxy configurado.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      APP_NAME: "Quem me deve"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: America/Sao_Paulo
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-time-zone=-03:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
